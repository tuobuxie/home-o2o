    <style>
        /* 隐藏滚动条但保持滚动功能，提升移动端体验 */

        }
        .no-scrollbar {

        }

            color: #111827; /* text-gray-900 */
            -webkit-tap-highlight-color: transparent;
        }
        /* 强制覆盖浏览器默认表单样式 */
        input, select, textarea {

            color: #111827;
        }
    </style>
